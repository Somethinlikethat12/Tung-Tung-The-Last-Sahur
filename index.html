<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tung Tung: The Last Sahur</title>
  <style>
    *{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080b20;color:#fff4d6;font:14px system-ui,sans-serif}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;padding:20px;display:flex;justify-content:space-between;flex-direction:column;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;gap:14px}.panel,.brand{background:#101230d9;border:1px solid #ffd16655;border-radius:14px;padding:14px;box-shadow:0 10px 30px #0006}.brand h1{margin:0;color:#ffd166;font-size:clamp(19px,4vw,30px)}.brand small{color:#aeb7f3}.stats{min-width:230px}.row{display:flex;justify-content:space-between;margin:4px 0}.bar{height:8px;background:#292d55;border-radius:9px;overflow:hidden;margin:5px 0 9px}.fill{height:100%;transition:width .2s}.hp{background:linear-gradient(90deg,#ff477e,#ffb36b)}.xp{background:linear-gradient(90deg,#47d8ff,#bd72ff);width:0}.help{line-height:1.7;color:#cdd3fa}.msg{align-self:flex-end;color:#ffd166;font-weight:800;font-size:16px;text-shadow:0 2px 8px #000}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#080b20dd;z-index:5}.card{text-align:center;background:#141735f2;border:1px solid #ffd16666;border-radius:20px;padding:32px;max-width:520px;margin:20px;box-shadow:0 20px 70px #0009}.card h2{color:#ffd166;font-size:clamp(30px,8vw,58px);line-height:.95;margin:0 0 16px}.card p{color:#cfd5ff;line-height:1.6}button{border:0;border-radius:99px;padding:14px 26px;background:linear-gradient(135deg,#ffd166,#ff9f1c);font-weight:900;cursor:pointer;box-shadow:0 6px 0 #a55327}.hidden{display:none!important}kbd{background:#282d56;border:1px solid #6971a5;border-radius:5px;padding:2px 6px}
  </style>
  <!-- OrbitControls imports the bare specifier "three". This import map resolves it in browsers. -->
    <!-- 1. ADD THIS RIGHT ABOVE YOUR GAME SCRIPT -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://jsdelivr.net",
        "three/addons/": "https://jsdelivr.net"
      }
    }
  
  </script>
</head>
<body>
  
  <div id="game"></div>
  <div id="hud" class="hud hidden"><div class="top"><div class="brand"><h1>⚡ TUNG TUNG</h1><small>THE LAST SAHUR · NIGHT 01</small></div><div class="panel stats"><div class="row"><b>HEART</b><span id="heart">100 / 100</span></div><div class="bar"><div id="health" class="fill hp"></div></div><div class="row"><b>DRUM POWER</b><span id="power">0 / 5</span></div><div class="bar"><div id="xp" class="fill xp"></div></div><div class="row"><small id="wave">WAVE 1</small><small id="score">SCORE 0</small></div></div></div><div class="bottom"><div class="panel help"><kbd>WASD</kbd> move · <kbd>CLICK</kbd>/<kbd>SPACE</kbd> bonk · <kbd>SHIFT</kbd> dash</div><div id="message" class="msg">Protect the last sahur!</div></div></div>
  <div id="start" class="screen"><div class="card"><h2>TUNG TUNG<br>THE LAST SAHUR</h2><p>Survive the creature swarm, collect glowing sahur bowls, and keep the final drumbeat alive.</p><button id="startButton">START THE DRUMBEAT</button></div></div>
  <div id="gameover" class="screen hidden"><div class="card"><h2 id="result">SAHUR SAVED!</h2><p id="summary"></p><button id="again">PLAY AGAIN</button></div></div>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b20);scene.fog=new THREE.Fog(0x090b20,18,58);
    const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,15,15);
    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.querySelector('#game').appendChild(renderer.domElement);
    const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.enablePan=false;orbit.minDistance=10;orbit.maxDistance=23;orbit.maxPolarAngle=Math.PI/2.25;
    scene.add(new THREE.HemisphereLight(0x9fa8ff,0x20142d,2.2));const moon=new THREE.DirectionalLight(0xffe7b0,3);moon.position.set(-8,16,8);moon.castShadow=true;scene.add(moon);
    const material=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.8,emissive:e,emissiveIntensity:e?1.4:0});
    const floor=new THREE.Mesh(new THREE.CylinderGeometry(25,25,.4,64),material(0x15183b));floor.position.y=-.35;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(50,25,0x363b70,0x20244b);grid.position.y=-.13;scene.add(grid);
    for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=18+Math.random()*7,h=1+Math.random()*3,b=new THREE.Mesh(new THREE.BoxGeometry(2.3,h,2.3),material(i%2?0x252650:0x332442));b.position.set(Math.cos(a)*r,h/2-.1,Math.sin(a)*r);scene.add(b)}
    const player=new THREE.Group();player.position.y=.5;scene.add(player);const body=new THREE.Mesh(new THREE.CylinderGeometry(.55,.7,1.2,12),material(0xd24b3e));body.position.y=.55;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.58,16,12),material(0xffc28d));head.position.y=1.35;head.castShadow=true;player.add(head);const drum=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.38,16),material(0xffcf57));drum.rotation.z=Math.PI/2;drum.position.set(.35,.8,0);player.add(drum);const stick=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.3,8),material(0xf6e0af));stick.rotation.z=-.7;stick.position.set(.85,1.05,.15);player.add(stick);
    function enemyMesh(){const g=new THREE.Group(),m=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,1),material(0x5b3d83));m.position.y=.75;m.castShadow=true;g.add(m);[-.22,.22].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),material(0xff477e,0xff477e));e.position.set(x,1.05,-.5);g.add(e)});return g}
    let enemies=[],bowls=[],running=false,hp=100,power=0,score=0,wave=1,spawnTimer=0,attackTimer=0;const keys={};
    function spawnEnemy(){const e=enemyMesh(),a=Math.random()*Math.PI*2,r=12+Math.random()*5;e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);e.userData={hp:2,speed:1.5+wave*.08};scene.add(e);enemies.push(e)}
    function spawnBowl(){const b=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),material(0xffd166,0xff9f1c));b.position.set((Math.random()-.5)*15,.5,(Math.random()-.5)*15);scene.add(b);bowls.push(b)}
    function hud(){health.style.width=Math.max(0,hp)+'%';heart.textContent=Math.ceil(hp)+' / 100';xp.style.width=power*20+'%';document.querySelector('#power').textContent=power+' / 5';document.querySelector('#wave').textContent='WAVE '+wave;document.querySelector('#score').textContent='SCORE '+score}
    function attack(){if(!running||attackTimer>0)return;attackTimer=.35;stick.rotation.x=-1.3;setTimeout(()=>stick.rotation.x=0,130);const dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);enemies.slice().forEach(e=>{const d=e.position.distanceTo(player.position),to=e.position.clone().sub(player.position).normalize();if(d<2.8&&dir.dot(to)>.05){e.userData.hp--;if(e.userData.hp<=0){scene.remove(e);enemies=enemies.filter(x=>x!==e);score+=100;power++;if(power>=5){power=0;wave++;message.textContent='LEVEL UP! The beat gets louder.'}}}});hud()}
    function finish(win){running=false;document.querySelector('#hud').classList.add('hidden');document.querySelector('#gameover').classList.remove('hidden');document.querySelector('#result').textContent=win?'SAHUR SAVED!':'THE DRUM WENT QUIET';document.querySelector('#summary').textContent=win?`You survived ${wave} waves and earned ${score} points.`:`The swarm got through. Final score: ${score}.`}
    function reset(){enemies.forEach(e=>scene.remove(e));bowls.forEach(b=>scene.remove(b));enemies=[];bowls=[];hp=100;power=0;score=0;wave=1;player.position.set(0,.5,0);running=true;document.querySelector('#start').classList.add('hidden');document.querySelector('#gameover').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');for(let i=0;i<4;i++)spawnEnemy();for(let i=0;i<2;i++)spawnBowl();message.textContent='Protect the last sahur!';hud()}
    function move(dt){const v=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(v.length()){v.normalize();player.position.addScaledVector(v,(keys.shift?9:5)*dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z,-17,17);player.rotation.y=Math.atan2(v.x,v.z)}}
    addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')attack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',attack);startButton.onclick=reset;again.onclick=reset;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(running){move(dt);attackTimer-=dt;spawnTimer-=dt;if(spawnTimer<0){spawnTimer=Math.max(2.5,6-wave*.3);spawnEnemy()}if(Math.random()<dt*.035)spawnBowl();enemies.forEach(e=>{const v=player.position.clone().sub(e.position);v.y=0;if(v.length()>1.4)e.position.addScaledVector(v.normalize(),e.userData.speed*dt);else{hp-=12*dt;if(hp<=0)finish(false)}});bowls.forEach(b=>{b.rotation.y+=dt*2;b.position.y=.5+Math.sin(now/250)*.15;if(b.position.distanceTo(player.position)<1.3){hp=Math.min(100,hp+18);score+=25;scene.remove(b);bowls=bowls.filter(x=>x!==b);message.textContent='Sahur acquired! +HEART';hud()}});hud()}orbit.target.lerp(new THREE.Vector3(player.position.x,0,player.position.z),.12);orbit.update();renderer.render(scene,camera)}loop(last);
  </script>
</body>
</html>
